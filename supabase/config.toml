# L+R Studio Supabase project config.
# Generated for the brand-kit enrichment edge function (phase 17).
# Hosted project ref: vmfwnfflhvskadkfnvds

project_id = "vmfwnfflhvskadkfnvds"

[functions.enrich-brand-kit]
# Verify the caller's JWT — the function only operates on brand kits the
# caller is allowed to read/edit per RLS. The function then uses the
# service role internally to write the enrichment back.
verify_jwt = true

[functions.send-email]
# Verify the caller's JWT. The function reads the target invitation
# through the caller's RLS scope (so they can only mail invites they have
# access to), then dispatches via Resend server-side.
verify_jwt = true

[functions.signup-for-invite]
# Anon-callable: the user isn't signed in yet — they just clicked the
# accept-invite link from their email and are creating an account. The
# function gates itself on the validity of the invitation token, which
# is the only credential the user has at this point.
verify_jwt = false

# fetch-trends does NOT live here — it's a Vercel serverless function at
# web/api/fetch-trends.ts. We deliberately moved it off Supabase Edge
# Functions on 2026-05-02 because the multipart deploy endpoint started
# 403'ing for our PAT and the deploy friction was costing us hours per
# iteration. Vercel co-deploys the API with the SPA on every push, so
# Trends Radar phases (Twitter/IG/LinkedIn) drop in via the same path.
