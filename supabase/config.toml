project_id = "vmfwnfflhvskadkfnvds"

[functions.enrich-brand-kit]
# Verify the caller's JWT — the function only operates on brand kits the
# caller is allowed to read/edit per RLS. The function then uses the
# service role internally to write the enrichment back.
verify_jwt = true

[functions.send-email]
# Verify the caller's JWT. The function reads the target invitation
# through the caller's RLS scope (so they can only mail invites they have
# access to), then dispatches via Resend server-side.
verify_jwt = true

[functions.fetch-trends]
# Verify the caller's JWT. The function additionally checks
# profiles.is_agency = true on the caller before scraping anything,
# so this is fully agency-gated at the API surface.
verify_jwt = true
